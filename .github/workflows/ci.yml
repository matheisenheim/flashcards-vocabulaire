name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "data/**", "test/**", "build.mjs", ".github/workflows/**"]
  pull_request:
    paths: ["src/**", "data/**", "test/**", "build.mjs", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe des sources
        run: node --check src/app.js && node --check src/sw.js && node --check build.mjs
      - name: Tests unitaires
        run: node --test
      - name: Build à jour (index.html/sw.js générés doivent être commités à jour)
        run: |
          node build.mjs
          git diff --exit-code -- index.html sw.js

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer actionlint v1.7.12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo rhysd/actionlint v1.7.12 --pattern '*_linux_amd64.tar.gz' --dir /tmp/actionlint
          tar -xzf /tmp/actionlint/actionlint_*_linux_amd64.tar.gz -C /tmp/actionlint ./actionlint
          echo "/tmp/actionlint" >> "$GITHUB_PATH"
      - name: Lint des workflows GitHub Actions
        run: actionlint -color
